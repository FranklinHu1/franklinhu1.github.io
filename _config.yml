# --- Site settings ---
title: Frank Hu
email: frankhu@stanford.edu
baseurl: ""
url: "https://franklinhu1.github.io"

# --- Author / social ---
author: Frank Hu
github_username: FranklinHu1

# --- Build settings ---
theme: minima
minima:
  skin: auto # respects the visitor's light/dark preference
  social_links:
    - platform: github
      user_name: FranklinHu1

# Order of the top navigation bar
header_pages:
  - about.md
  - publications.md
  - repositories.md
  - cv.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Show excerpts on the home page post list
show_excerpts: true

# --- Exclude from processing ---
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
